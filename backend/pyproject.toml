[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "way-backend"
version = "2.4.0"
description = "WAY Platform - Production Ready Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0,<5.1",
    "djangorestframework>=3.14",
    "django-filter>=23.5",
    "channels>=4.0",
    "channels-redis>=4.1",
    "daphne>=4.0",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "celery>=5.3",
    "cryptography>=42.0",
    "PyJWT>=2.8",
    "httpx>=0.27",
    "pydantic>=2.6",
    "tenacity>=8.2",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "argon2-cffi>=23.1",
    "pillow>=10.2",
    "gunicorn>=21.2",
    "whitenoise>=6.6",
    "drf-spectacular>=0.27",
    "django-cors-headers>=4.3",
    "django-redis>=5.4",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "factory-boy>=3.3",
    "freezegun>=1.4",
    "ruff>=0.2",
    "mypy>=1.8",
    "coverage>=7.4",
    "faker>=23.0",
]

[tool.setuptools]
packages = ["way_project", "way_core", "way_identity", "way_finance", "way_skills", "way_infra", "way_ops"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "way_project.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-v --tb=short"
